name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v0.1.0), created on the commit being built. Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cli
      - run: npm run build:cli
      - run: npm test

  # Flip-speed budget: every arrow press must paint within 50 ms. Also
  # Brackit Lite (the web version), checked against the desktop app.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            lite/wasm
          key: cli
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:cli
      - run: npm run test:ui

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            asset: Brackit-macOS-AppleSilicon.dmg
            pattern: dmg/*.dmg
          - name: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            asset: Brackit-macOS-Intel.dmg
            pattern: dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            asset: Brackit-Linux.AppImage
            pattern: appimage/*.AppImage
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: Brackit-Windows-Setup.exe
            pattern: nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build app
        # bundling downloads helper tools from GitHub releases; retry if that
        # download hiccups (e.g. HTTP 504) rather than failing the build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} && exit 0
            echo "build attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: Build terminal-only binary
        shell: bash
        run: |
          cargo build --release --no-default-features --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
          mkdir -p cli
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp src-tauri/target/${{ matrix.target }}/release/brackit$ext cli/brackit-${{ matrix.name }}$ext
      - name: Name the download
        # fixed names, so links to releases/latest/download/<name> always work
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.pattern }} "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Brackit-${{ matrix.name }}
          compression-level: 0
          if-no-files-found: error
          path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: brackit-cli-${{ matrix.name }}
          if-no-files-found: error
          path: cli/*

  release:
    needs: app
    # on a pushed v* tag, or when run by hand with a release_tag
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Brackit ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/*
          body_path: src/CHANGELOG.md
