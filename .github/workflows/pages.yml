name: website

# Builds the Hugo site in site/, with Brackit Lite (the web version) at
# /lite/, and publishes it to GitHub Pages.
# Repository settings → Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'lite/**', 'src-tauri/src/jpeg.rs', 'scripts/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'web/**', 'lite/**', 'src-tauri/src/jpeg.rs', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.140.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build Brackit Lite into the site
        run: node scripts/build-lite.mjs site/static/lite
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar xzf hugo.tgz hugo && sudo mv hugo /usr/local/bin/
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --minify --source site --baseURL "${{ steps.pages.outputs.base_url || 'https://lawrenceleejr.github.io/Brackit' }}/"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
