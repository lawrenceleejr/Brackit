[package]
name = "brackit"
version = "0.1.0"
description = "Review Fujifilm film-simulation brackets side by side"
edition = "2021"
default-run = "brackit"

[[bin]]
name = "brackit"
path = "src/main.rs"

[features]
default = ["gui"]
# The Mac/Windows/Linux app window. Without it the binary is the
# terminal + browser version only (`brackit --serve`).
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
ctrlc = "3"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
