<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} · film simulation brackets, side by side{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta property="og:title" content="{{ site.Title }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:image" content="{{ "img/brackets.jpg" | absURL }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "site.css" | relURL }}">
</head>
<body>
  {{ block "main" . }}{{ end }}
  <footer class="foot">
    <p>Made by Lawrence Lee for his own Fujifilm workflow. Free and open source on <a href="{{ site.Params.repo }}">GitHub</a>.
    Not affiliated with Fujifilm.</p>
  </footer>
</body>
</html>
